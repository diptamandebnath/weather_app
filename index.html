<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #6a11cb, #2575fc);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.weather-container {
    text-align: center;
    padding: 40px;
    background: rgba(255,255,255,0.9);
    border-radius: 15px;
    width: 350px;
}

h1 { color: #6a11cb; }

input {
    padding: 10px;
    width: 250px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.weather-info {
    margin-top: 20px;
    display: none;
    text-align: left;
}

.error {
    color: red;
}
</style>
</head>

<body>

<div class="weather-container">
    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter city (e.g. Agartala)">
    <button onclick="getWeather()">Get Weather</button>

    <div id="weather" class="weather-info"></div>
    <div id="error" class="error"></div>
</div>

<script>
async function getWeather() {
    const city = document.getElementById("city").value.trim();
    const weatherDiv = document.getElementById("weather");
    const errorDiv = document.getElementById("error");

    weatherDiv.style.display = "none";
    errorDiv.textContent = "";

    if (!city) {
        errorDiv.textContent = "Enter a city name";
        return;
    }

    weatherDiv.innerHTML = "Loading...";
    weatherDiv.style.display = "block";

    try {
        // Step 1: Get coordinates from Open-Meteo geocoding
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
            throw new Error("City not found");
        }

        const { latitude, longitude, name, country } = geoData.results[0];

        // Step 2: Get weather using coordinates
        const weatherRes = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`
        );

        const weatherData = await weatherRes.json();
        const current = weatherData.current_weather;

        weatherDiv.innerHTML = `
            <p><strong>Location:</strong> ${name}, ${country}</p>
            <p><strong>Temperature:</strong> ${current.temperature} °C</p>
            <p><strong>Wind Speed:</strong> ${current.windspeed} km/h</p>
            <p><strong>Weather Code:</strong> ${current.weathercode}</p>
        `;

    } catch (err) {
        weatherDiv.style.display = "none";
        errorDiv.textContent = "Error: " + err.message;
    }
}
</script>

</body>
</html>
