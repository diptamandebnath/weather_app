<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Real-time weather app with accurate forecasts">
<title>Weather App</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #6a11cb, #2575fc);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.weather-container {
    text-align: center;
    padding: 40px 30px;
    background-color: rgba(255,255,255,0.9);
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(0,0,0,0.2);
    width: 350px;
}

h1 {
    color: #6a11cb;
}

input {
    padding: 10px;
    width: 250px;
    border: 2px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
}

button {
    display: block;
    margin: 10px auto;
    padding: 12px 25px;
    border: none;
    background-color: #4CAF50;
    color: white;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
}

button:hover {
    background-color: #45a049;
}

.weather-info {
    margin-top: 20px;
    display: none;
    text-align: left;
}

.error-message {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="weather-container">
    <h1>Weather App</h1>

    <input type="text" id="cityInput" placeholder="Enter city name (e.g. Tripura)">
    <button onclick="getWeather()">Get Weather</button>

    <div id="weatherInfo" class="weather-info"></div>
    <div id="errorMessage" class="error-message"></div>
</div>

<script>
async function getWeather() {
    const city = document.getElementById('cityInput').value.trim();
    const weatherInfo = document.getElementById('weatherInfo');
    const errorMessage = document.getElementById('errorMessage');

    weatherInfo.style.display = "none";
    errorMessage.textContent = "";

    if (!city) {
        errorMessage.textContent = "Please enter a city name!";
        return;
    }

    weatherInfo.innerHTML = "Loading...";
    weatherInfo.style.display = "block";

    try {
        const url = `https://api.allorigins.win/raw?url=https://wttr.in/${encodeURIComponent(city)}?format=j1`;

        const response = await fetch(url);
        if (!response.ok) throw new Error("Failed to fetch weather");

        const data = await response.json();
        const current = data.current_condition[0];

        const condition = current.weatherDesc[0].value;
        const temperature = current.temp_C + "°C";
        const wind = current.windspeedKmph + " km/h";
        const humidity = current.humidity + "%";

        weatherInfo.innerHTML = `
            <p><strong>Condition:</strong> ${condition}</p>
            <p><strong>Temperature:</strong> ${temperature}</p>
            <p><strong>Wind:</strong> ${wind}</p>
            <p><strong>Humidity:</strong> ${humidity}</p>
        `;

    } catch (err) {
        weatherInfo.style.display = "none";
        errorMessage.textContent = "Error: Unable to fetch weather data";
    }
}
</script>

</body>
</html>
