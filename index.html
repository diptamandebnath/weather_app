<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time weather app">
    <title>Weather App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .weather-container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            width: 350px;
        }

        h1 {
            color: #6a11cb;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .weather-info {
            margin-top: 20px;
            display: none;
            text-align: left;
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="weather-container">
    <h1>Weather App</h1>

    <input type="text" id="cityInput" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <div id="weatherInfo" class="weather-info"></div>
    <div id="errorMessage" class="error-message"></div>
</div>

<script>
async function getWeather() {
    const city = document.getElementById('cityInput').value.trim();
    const weatherInfoDiv = document.getElementById('weatherInfo');
    const errorMessageDiv = document.getElementById('errorMessage');

    weatherInfoDiv.style.display = "none";
    errorMessageDiv.textContent = "";

    if (!city) {
        errorMessageDiv.textContent = "Please enter a city name!";
        return;
    }

    weatherInfoDiv.innerHTML = "Loading...";
    weatherInfoDiv.style.display = "block";

    try {
        const url = `https://api.allorigins.win/raw?url=https://wttr.in/${encodeURIComponent(city)}?format=j1`;

        const response = await fetch(url);
        if (!response.ok) throw new Error("Failed to fetch data");

        const data = await response.json();
        const current = data.current_condition[0];

        weatherInfoDiv.innerHTML = `
            <p><strong>Condition:</strong> ${current.weatherDesc[0].value}</p>
            <p><strong>Temperature:</strong> ${current.temp_C} °C</p>
            <p><strong>Wind:</strong> ${current.windspeedKmph} km/h</p>
            <p><strong>Humidity:</strong> ${current.humidity}%</p>
        `;

    } catch (error) {
        weatherInfoDiv.style.display = "none";
        errorMessageDiv.textContent = "Error: Unable to fetch weather data";
    }
}
</script>

</body>
</html>
