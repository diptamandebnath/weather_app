<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="description" content="Stay updated with real-time weather forecasts, temperature, humidity, and wind details. Explore an intuitive and user-friendly weather app for accurate local and global weather updates"> 
<title>Real-Time Weather App | Accurate Local & Global Forecasts</title>

    <style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #141e30, #243b55);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glass Dark Card */
.weather-app {
    width: 340px;
    padding: 25px 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(20px);
    color: #fff;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* Title */
h2 {
    margin: 0 0 10px;
    font-weight: 500;
}

/* Input */
input {
    width: 85%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.1);
    color: white;
}

/* Button */
button {
    padding: 8px 20px;
    border: none;
    border-radius: 10px;
    background: #00c853;
    color: white;
    cursor: pointer;
    margin-top: 5px;
}

/* Weather */
#weather {
    margin-top: 12px;
}

/* Main */
.main-temp {
    font-size: 48px;
    font-weight: bold;
}

.location {
    font-size: 16px;
    opacity: 0.7;
}

.description {
    margin-top: 4px;
}

/* Grid */
.details {
    margin-top: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.box {
    background: rgba(255,255,255,0.08);
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
}

/* Error */
.error {
    color: #ff5252;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="weather-app">
    <h2>Weather</h2>

    <input type="text" id="city" placeholder="Enter city (e.g. Agartala)">
    <button onclick="getWeather()">Search</button>

    <div id="weather"></div>
    <div id="error" class="error"></div>
</div>

<script>
function getWeatherDescription(code) {
    if (code === 0) return "Clear Sky ☀️";
    if (code <= 2) return "Partly Cloudy ⛅";
    if (code === 3) return "Cloudy ☁️";
    if (code <= 48) return "Fog 🌫️";
    if (code <= 67) return "Rain 🌧️";
    if (code <= 77) return "Snow ❄️";
    if (code <= 99) return "Thunderstorm ⛈️";
    return "Unknown";
}

async function getWeather() {
    const city = document.getElementById("city").value.trim();
    const weatherDiv = document.getElementById("weather");
    const errorDiv = document.getElementById("error");

    weatherDiv.innerHTML = "";
    errorDiv.textContent = "";

    if (!city) {
        errorDiv.textContent = "Enter a city name";
        return;
    }

    weatherDiv.innerHTML = "Loading...";

    try {
        // Get coordinates
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}`);
        const geoData = await geoRes.json();

        if (!geoData.results) throw new Error("City not found");

        const { latitude, longitude, name, country } = geoData.results[0];

        // Get weather
        const weatherRes = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`
        );

        const data = await weatherRes.json();
        const w = data.current_weather;

        const desc = getWeatherDescription(w.weathercode);
        const time = new Date(w.time).toLocaleString();

        weatherDiv.innerHTML = `
            <div class="location">${name}, ${country}</div>
            <div class="main-temp">${w.temperature}°C</div>
            <div class="description">${desc}</div>

            <div class="details">
                <div class="box">💨 Wind: ${w.windspeed} km/h</div>
                <div class="box">🧭 Direction: ${w.winddirection}°</div>
                <div class="box">⏱ ${time}</div>
                <div class="box">🌡 Code: ${w.weathercode}</div>
            </div>
        `;
    } catch (err) {
        weatherDiv.innerHTML = "";
        errorDiv.textContent = "Error: " + err.message;
    }
}
</script>

</body>
</html>
